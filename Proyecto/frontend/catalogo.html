<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Recursos</title>
    <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>
    <div class="container">
        <div class="regresar">
            <a href="../index.html"> Regresar
            </a>
        </div>
        <h1>Catálogo de Recursos</h1>

        <!-- Sección de búsqueda -->
        <div class="buscar-recurso">
            <input type="text" id="buscarInput" placeholder="Buscar recurso...">
        </div>

        <!-- Tabla de recursos -->
        <table id="tabla-recursos">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Autor</th>
                    <th>Departamento</th>
                    <th>Empresa</th>
                    <th>Descripción</th>
                    <th>Fecha de ingreso</th>
                    <th>Tipo</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se llenarán los datos del dashboard -->
                <tr>
                    <td>Recurso 1</td>
                    <td>Categoria A</td>
                    <td>Descripción del recurso 1</td>
                    <td>2025-12-03</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Recurso 2</td>
                    <td>Categoria B</td>
                    <td>Descripción del recurso 2</td>
                    <td>2025-12-02</td>
                </tr>
                <!-- Más filas según los datos del dashboard -->
            </tbody>
        </table>
    </div>
</body>
</html>
