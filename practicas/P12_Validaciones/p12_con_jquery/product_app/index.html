<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ProductApp</title>
  <link rel="stylesheet" href="https://bootswatch.com/4/superhero/bootstrap.min.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">ProductApp</a>
    <div class="collapse navbar-collapse">
      <form class="form-inline ml-auto">
        <input class="form-control mr-2" id="search" type="search" placeholder="Buscar producto">
        <button class="btn btn-success" type="submit">Buscar</button>
      </form>
    </div>
  </nav>

  <div class="container">
    <div class="row p-4">

      <!-- FORMULARIO -->
      <div class="col-md-5">
        <div class="card">
          <div class="card-body">

            <form id="product-form">

              <!-- NOMBRE -->
              <div class="form-group">
                <input class="form-control" type="text" id="name" placeholder="Nombre de producto">
                <small id="name-status" class="text-warning" style="display:none;"></small>
              </div>

              <!-- MARCA -->
              <div class="form-group">
                <input class="form-control" type="text" id="brand" placeholder="Marca">
                <small id="brand-status" class="text-warning" style="display:none;"></small>
              </div>

              <!-- PRECIO -->
              <div class="form-group">
                <input class="form-control" type="number" id="price" placeholder="Precio">
                <small id="price-status" class="text-warning" style="display:none;"></small>
              </div>

              <!-- MODELO -->
<div class="form-group">
  <input class="form-control" type="text" id="model" placeholder="Modelo">
  <small id="model-status" class="text-warning" style="display:none;"></small>
</div>

<!-- UNIDADES -->
<div class="form-group">
  <input class="form-control" type="number" id="units" placeholder="Unidades disponibles">
  <small id="units-status" class="text-warning" style="display:none;"></small>
</div>

<!-- DETALLES -->
<div class="form-group">
  <input class="form-control" type="text" id="details" placeholder="Detalles (opcional)">
  <small id="details-status" class="text-warning" style="display:none;"></small>
</div>

<!-- IMAGEN -->
<div class="form-group">
  <input class="form-control" type="text" id="image" placeholder="URL de imagen (opcional)">
  <small id="image-status" class="text-warning" style="display:none;"></small>
</div>


              <input type="hidden" id="productId">

              <button class="btn btn-primary btn-block" type="submit">
                Agregar Producto
              </button>
            </form>

          </div>
        </div>
      </div>

      <!-- TABLA DE PRODUCTOS -->
      <div class="col-md-7">

        <table class="table table-bordered table-sm">
          <thead>
            <tr>
              <td>ID</td>
              <td>Nombre</td>
              <td>Marca</td>
              <td>Precio</td>
              <td>Descripción</td>
            </tr>
          </thead>
          <tbody id="products"></tbody>
        </table>

      </div>

    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
